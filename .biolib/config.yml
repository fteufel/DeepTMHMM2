biolib_version: 2

modules:
  main:
    image: "local-docker://deeptmhmm2:latest"
    command: "dtm2 --model-dir checkpoints"
    working_directory: /home/biolib/
    default_machine: "gpu.small"
    input_files:
      - COPY / /home/biolib/
    output_files:
      - COPY /home/biolib/output/ /

main_output_file: "/TMRs.gff3"
arguments:
  - key: ""
    description: "Enter one or more proteins:"
    type: sequence
    required: true
    default_value: "sample.fasta"
  - key: ""
    default_value: "output"
    description: "output dir"
    type: hidden
    required: false
