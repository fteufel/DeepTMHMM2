biolib_version: 2

modules:
  main:
    image: "local-docker://deeptmhmm2:latest"
    command: "/home/biolib/run.sh"
    working_directory: /home/biolib/
    default_machine: "gpu.small"
    input_files:
      - COPY / /home/biolib/
    output_files:
      - COPY /home/biolib/results/ /
      - COPY /home/biolib/output.md /

main_output_file: "/output.md"
arguments:
  - key: ""
    description: "Enter one or more proteins:"
    type: sequence
    required: true
    default_value: "sample.fasta"
  - key: "--plot"
    description: "Generate plots"
    type: toggle
    default_value: "--plot"
    options:
      "on": "--plot"
      "off": ""
    required: false
  - key: "--simplify-io"
    description: "Use simplified inside/outside labels"
    type: toggle
    options:
      "on": "--simplify-io"
      "off": ""
    required: false
  - key: "--marginals"
    description: "Compute marginal probabilities"
    type: toggle
    options:
      "on": "--marginals"
      "off": ""
    required: false
  - key: ""
    default_value: "results"
    description: "output dir"
    type: hidden
    required: false


citation:
    entry_type: article
    author: >-
         Felix Teufel, Jeppe Hallgren, Henrik Nielsen, Anders Krogh, Konstantinos D. Tsirigos, Ole Winther
    journal: Biorxiv
    month: '8'
    title: DeepTMHMM2 enables accurate prediction of transmembrane protein topology and subcellular location
    year: '2026'
    url: https://www.biorxiv.org/content/10.64898/2026.08.24.746435v1
    doi: 10.64898/2026.08.24.746435