biolib_version: 2

modules:
  main:
    image: "local-docker://deeptmhmm2:latest"
    command: "/home/biolib/run.sh"
    working_directory: /home/biolib/
    default_machine: "gpu.small"
    input_files:
      - COPY / /home/biolib/
    output_files:
      - COPY /home/biolib/results/ /
      - COPY /home/biolib/output.md /

main_output_file: "/output.md"
arguments:
  - key: ""
    description: "Enter one or more proteins:"
    type: sequence
    required: true
    default_value: "sample.fasta"
  - key: "--plot"
    description: "Generate plots"
    type: toggle
    default_value: "--plot"
    options:
      "on": "--plot"
      "off": ""
    required: false
  - key: "--simplify-io"
    description: "Use simplified inside/outside labels"
    type: toggle
    options:
      "on": "--simplify-io"
      "off": ""
  - key: "--marginals"
    description: "Compute marginals for each prediction"
    type: toggle
    options:
      "on": "--marginals"
      "off": ""
    required: false
  - key: ""
    default_value: "results"
    description: "output dir"
    type: hidden
    required: false


